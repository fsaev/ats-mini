name: Build Firmware

on:
  pull_request:
    branches:
      - main
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'main/Kconfig.projbuild'
      - 'partitions.csv'
      - 'sdkconfig.*'
      - 'changelog/**'
      - 'CHANGELOG.md'
      - '.github/workflows/build.yml'
      - '.pre-commit-config.yaml'
  push:
    # tags:
    #   - 'v*'
    # branches:
    #   - main
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'main/Kconfig.projbuild'
      - 'partitions.csv'
      - 'sdkconfig.*'
      - 'changelog/**'
      - 'CHANGELOG.md'
      - '.github/workflows/build.yml'
      - '.pre-commit-config.yaml'
  workflow_dispatch:
    inputs:
      revision:
        description: "A tag to release, e.g. v1.00"
        type: string
        required: false

jobs:
  build:
    name: build ${{ matrix.board.artifact-suffix }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: true
      matrix:
        board:
          - artifact-suffix: ospi
          - artifact-suffix: qspi
          - artifact-suffix: lilygo-t-embed
            # The T-Embed uses the settings of its own sdkconfig.lilygo file
            defaults-suffix: lilygo

    outputs:
      slug: ${{ steps.slug.outputs.slug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          ref: "${{ github.event.inputs.revision || github.ref }}"

      - name: Get version slug
        id: slug
        run: |
          echo "slug=$(git describe --tags --match 'v?.??' --always --dirty || echo v0.00)" >> "$GITHUB_OUTPUT"

      - name: Compile firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: >-
            idf.py
            -B build/${{ matrix.board.artifact-suffix }}
            -D SDKCONFIG=build/${{ matrix.board.artifact-suffix }}/sdkconfig
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.${{ matrix.board.defaults-suffix || matrix.board.artifact-suffix }}"
            build

      - name: Merge the binaries into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: >-
            idf.py
            -B build/${{ matrix.board.artifact-suffix }}
            -D SDKCONFIG=build/${{ matrix.board.artifact-suffix }}/sdkconfig
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.${{ matrix.board.defaults-suffix || matrix.board.artifact-suffix }}"
            merge-bin -o ats-mini.merged.bin

      - name: Install uv and python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: "pyproject.toml"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Compile the unreleased changelog
        run: |
          # shellcheck disable=SC2015
          ls changelog/*.md && uv run towncrier build --keep --version Unreleased || true

      - name: Prepare compiled artifact
        run: |
          mkdir -p artifact/ats-mini-${{ steps.slug.outputs.slug }}-${{ matrix.board.artifact-suffix }}
          BUILD="build/${{ matrix.board.artifact-suffix }}"
          DEST="artifact/ats-mini-${{ steps.slug.outputs.slug }}-${{ matrix.board.artifact-suffix }}"
          cp "$BUILD/bootloader/bootloader.bin" "$DEST/ats-mini.bootloader.bin"
          cp "$BUILD/partition_table/partition-table.bin" "$DEST/ats-mini.partitions.bin"
          cp "$BUILD/ats-mini.bin" "$DEST/ats-mini.bin"
          cp "$BUILD/ats-mini.merged.bin" "$DEST/ats-mini.merged.bin"
          cp CHANGELOG.md artifact/ats-mini-${{ steps.slug.outputs.slug }}-${{ matrix.board.artifact-suffix }}/

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ github.event.repository.name }}-${{ steps.slug.outputs.slug }}-${{ matrix.board.artifact-suffix }}
          path: artifact

  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'ats-mini-*'
          merge-multiple: true
          path: artifact
      - name: Archive the build artifacts
        run: cd "artifact" && find . -mindepth 1 -maxdepth 1 -type d -exec sh -c 'zip -r "../${1%/}.zip" "$1"' _ {} \;
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.build.outputs.slug }}
        run: >-
          python -c 'import os,re; t=open(f"""artifact/ats-mini-{os.environ["SLUG"]}-ospi/CHANGELOG.md""").read(); r=re.search(f"""(^## {os.environ["SLUG"][1:].replace(".", "\\.")} .*?)(?=^## \\d|\\Z)""", t, re.MULTILINE | re.DOTALL); print(r.group(0) if r else "")' |
          gh release create "$SLUG" --repo '${{ github.repository }}' --notes-file -
      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FILENAMES: ${{ github.event.repository.name }}-${{ needs.build.outputs.slug }}-*.zip
          SLUG: ${{ needs.build.outputs.slug }}
        run: |
          # shellcheck disable=SC2086
          gh release upload "$SLUG" $FILENAMES --repo '${{ github.repository }}' --clobber
